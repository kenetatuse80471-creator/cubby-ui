name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tokens must rebuild byte-identically to what is committed in packages/tokens/dist.
      - name: Tokens
        run: pnpm tokens:check

      - name: Registry
        run: pnpm registry:validate

      # Gate on literal colours/sizes/radii in packages/registry/src/{ui,lib} — see
      # packages/registry/scripts/lint-tokens.ts.
      - name: Lint tokens
        run: pnpm lint:tokens

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
