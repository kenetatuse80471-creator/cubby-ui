packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 asks explicitly which dependencies may run install scripts.
# @parcel/watcher (pulled in by @changesets/cli) ships prebuilt binaries, so it does not
# need one; without this entry `pnpm install` exits non-zero and CI fails on the first step.
allowBuilds:
  "@parcel/watcher": false

# Written by `pnpm install` itself: the store enforces a minimum release age, and
# next 16.3.5 is newer than that threshold. Without these entries a fresh install
# refuses to resolve Next and `apps/www` cannot be built.
minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - next@16.3.5
